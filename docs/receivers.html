<!doctype html>
<!-- Source of docs/receivers.png. Each screenshot is scaled to the column width (758 px) and
     centred in its panel. Rebuild: msedge --headless --force-device-scale-factor=2
     --window-size=1600,569 --screenshot=receivers.png receivers.html -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #0b0b0c; width: 1600px; height: 569px; overflow: hidden; }
  body { padding: 16px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; row-gap: 16px;
         font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  figure { display: flex; flex-direction: column; }
  .shot { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; }
  img { display: block; }
  figcaption { height: 32px; padding-top: 8px; font-size: 16px; font-weight: 600; color: #e6e6e8; text-align: center; }
</style>
</head>
<body>
  <figure>
    <div class="shot" style="background:#181818"><img src="claude-receives.png" width="758" height="163"></div>
    <figcaption>Claude Code</figcaption>
  </figure>
  <figure>
    <div class="shot" style="background:#181818"><img src="codex-receives.png" width="758" height="221"></div>
    <figcaption>Codex</figcaption>
  </figure>
  <figure>
    <div class="shot" style="background:#141414"><img src="cursor-receives.png" width="758" height="196"></div>
    <figcaption>Cursor</figcaption>
  </figure>
  <figure>
    <div class="shot" style="background:#000"><img src="antigravity-receives.png" width="758" height="121"></div>
    <figcaption>Antigravity</figcaption>
  </figure>
</body>
</html>
