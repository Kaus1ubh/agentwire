<!doctype html>
<!-- Source of docs/receivers.png. Each screenshot is scaled to the column width (720 px) and
     centred in its panel. Rebuild: msedge --headless --force-device-scale-factor=2
     --window-size=1600,676 --screenshot=receivers.png receivers.html -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #0b0b0c; width: 1600px; height: 676px; overflow: hidden; }
  body { padding: 40px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; row-gap: 32px;
         font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  figure { display: flex; flex-direction: column; }
  .shot { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 14px; }
  img { display: block; }
  figcaption { height: 44px; padding-top: 14px; font-size: 16px; font-weight: 600; color: #e6e6e8; text-align: center; }
</style>
</head>
<body>
  <figure>
    <div class="shot" style="background:#181818"><img src="claude-receives.png" width="720" height="136"></div>
    <figcaption>Claude Code</figcaption>
  </figure>
  <figure>
    <div class="shot" style="background:#181818"><img src="codex-receives.png" width="720" height="210"></div>
    <figcaption>Codex</figcaption>
  </figure>
  <figure>
    <div class="shot" style="background:#141414"><img src="cursor-receives.png" width="720" height="186"></div>
    <figcaption>Cursor</figcaption>
  </figure>
  <figure>
    <div class="shot" style="background:#000"><img src="antigravity-receives.png" width="720" height="115"></div>
    <figcaption>Antigravity</figcaption>
  </figure>
</body>
</html>
