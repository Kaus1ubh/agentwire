<!doctype html>
<!-- Source of docs/receivers-cli.png. All four come from one terminal at one font size and are
     cropped to the same width, so one scale fits all. Rebuild: msedge --headless --force-device-scale-factor=2
     --window-size=1600,352 --screenshot=receivers-cli.png receivers-cli.html -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #18181b; width: 1600px; height: 352px; overflow: hidden; }
  body { padding: 16px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; row-gap: 16px;
         font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  figure { display: flex; flex-direction: column; }
  .shot { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; }
  img { display: block; }
  figcaption { height: 32px; padding-top: 8px; font-size: 16px; font-weight: 600; color: #e6e6e8; text-align: center; }
</style>
</head>
<body>
  <figure>
    <div class="shot" style="background:#0c0c0c"><img src="claude-cli.png" width="758" height="62"></div>
    <figcaption>Claude Code</figcaption>
  </figure>
  <figure>
    <div class="shot" style="background:#0c0c0c"><img src="codex-cli.png" width="758" height="104"></div>
    <figcaption>Codex</figcaption>
  </figure>
  <figure>
    <div class="shot" style="background:#0c0c0c"><img src="cursor-cli.png" width="758" height="96"></div>
    <figcaption>Cursor</figcaption>
  </figure>
  <figure>
    <div class="shot" style="background:#0c0c0c"><img src="agy-cli.png" width="758" height="62"></div>
    <figcaption>Antigravity</figcaption>
  </figure>
</body>
</html>
